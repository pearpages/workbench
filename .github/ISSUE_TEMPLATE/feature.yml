name: Feature
description: A new capability
labels: ["type:feature"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist that doesn't yet.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or who it is for.
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
