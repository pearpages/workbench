name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Versions, logs, screenshots.
